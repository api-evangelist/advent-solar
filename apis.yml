name: Advent Solar
description: Advent Solar was a silicon photovoltaic company founded in 2002 and headquartered in
  Albuquerque, New Mexico, that designed and manufactured crystalline-silicon (c-Si) solar cells and
  modules, pioneering emitter-wrap-through cell architectures and streamlined back-contact module
  assembly. Backed by Battery Ventures, EnerTech Capital, @Ventures and others across roughly $109M in
  venture funding (including a $70M Series D in 2007), the company's assets and intellectual property
  were acquired by Applied Materials in late 2009 / 2010. As a physical solar-hardware manufacturer that
  is no longer operating independently, Advent Solar exposes no public API, developer portal, or software
  surface; this profile is retained as a network identity record with no API artifacts to enrich.
